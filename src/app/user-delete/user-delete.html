<div class="user-delete-container">
    <h2>Delete Person</h2>
    <div *ngIf="user" class="user-details">
        <p class="warning-text">⚠️ Are you sure you want to delete this person?</p>
        <div class="detail-card">
            <div class="detail-row">
                <span class="detail-label">Name:</span>
                <span class="detail-value">{{ user.name }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Age:</span>
                <span class="detail-value">{{ user.age }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Gender:</span>
                <span class="detail-value">{{ user.gender }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Mobile:</span>
                <span class="detail-value">{{ user.mobile }}</span>
            </div>
        </div>
        <div class="action-buttons">
            <button [disabled]="loading" (click)="confirmDelete()" class="btn btn-danger">
                {{ loading ? 'Deleting...' : 'Yes, Delete' }}
            </button>
            <button (click)="cancel()" class="btn btn-secondary">Cancel</button>
        </div>
    </div>
    <div *ngIf="!user" class="loading-text">
        Loading person details...
    </div>
</div>
